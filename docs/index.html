<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asr Shifo — Onlayn ariza</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --teal-dark: #0f766e;
    --teal: #14b8a6;
    --teal-light: #d1fae5;
    --bg: #f0fdfa;
    --text: #134e4a;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  .header {
    background: linear-gradient(135deg, var(--teal-dark), var(--teal));
    color: white;
    padding: 28px 20px 24px;
    text-align: center;
    border-radius: 0 0 24px 24px;
  }
  .header .logo-circle {
    width: 64px; height: 64px;
    background: white;
    border-radius: 50%;
    margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }

  .container { padding: 20px; }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--teal-dark);
    margin: 20px 0 10px;
  }

  .service-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .service-card {
    background: var(--white);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(15,118,110,0.08);
    transition: all 0.15s;
  }
  .service-card .emoji { font-size: 26px; display: block; margin-bottom: 6px; }
  .service-card .name { font-size: 13px; font-weight: 600; }
  .service-card .hours { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .service-card.selected {
    border-color: var(--teal);
    background: var(--teal-light);
  }

  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--teal-dark); }
  input {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    background: white;
    outline: none;
  }
  input:focus { border-color: var(--teal); }

  .time-note {
    background: var(--teal-light);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--teal-dark);
    margin-top: 8px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--teal-dark);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 20px;
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; }

  .error-msg {
    color: #dc2626;
    font-size: 12.5px;
    margin-top: 6px;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-circle">🏥</div>
  <h1>Asr Shifo</h1>
  <p>Onlayn navbatga yozilish</p>
</div>

<div class="container">
  <div class="section-title">1. Shifokor yoki xizmatni tanlang</div>
  <div class="service-grid" id="serviceGrid">
    <div class="service-card" data-name="Nevropatolog" data-hours="">
      <span class="emoji">🧠</span>
      <div class="name">Nevropatolog</div>
      <div class="hours">13:00 gacha</div>
    </div>
    <div class="service-card" data-name="Kardiolog" data-hours="">
      <span class="emoji">❤️</span>
      <div class="name">Kardiolog</div>
      <div class="hours">13:00 gacha</div>
    </div>
    <div class="service-card" data-name="Massaj" data-hours="08:00 - 13:00">
      <span class="emoji">💆</span>
      <div class="name">Massaj</div>
      <div class="hours">08:00 - 13:00</div>
    </div>
    <div class="service-card" data-name="Xijama" data-hours="08:00 - 17:00">
      <span class="emoji">🩸</span>
      <div class="name">Xijama</div>
      <div class="hours">08:00 - 17:00</div>
    </div>
    <div class="service-card" data-name="Stomatologiya" data-hours="13:00 - 17:00">
      <span class="emoji">🦷</span>
      <div class="name">Stomatologiya</div>
      <div class="hours">13:00 - 17:00</div>
    </div>
  </div>

  <div class="section-title">2. Ma'lumotlaringiz</div>
  <div class="form-group">
    <label>To'liq ism-familiya</label>
    <input type="text" id="fullName" placeholder="Masalan: Aliyev Vali">
  </div>
  <div class="form-group">
    <label>Telefon raqam</label>
    <input type="tel" id="phone" placeholder="+998 90 123 45 67">
  </div>
  <div class="form-group" id="timeGroup" style="display:none;">
    <label>Kelish vaqti</label>
    <input type="text" id="timeInput" placeholder="masalan: 14:30">
    <div class="time-note" id="timeNote"></div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <button class="submit-btn" id="submitBtn">✅ Navbatga yozilish</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();

  let selectedService = null;
  const cards = document.querySelectorAll('.service-card');
  const timeGroup = document.getElementById('timeGroup');
  const timeNote = document.getElementById('timeNote');
  const errorMsg = document.getElementById('errorMsg');
  const paidServices = ['Massaj', 'Xijama', 'Stomatologiya'];

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedService = card.dataset.name;
      const hours = card.dataset.hours;

      if (paidServices.includes(selectedService)) {
        timeGroup.style.display = 'block';
        timeNote.style.display = 'block';
        timeNote.textContent = `🕐 Ish vaqti: ${hours}. To'lov klinikada amalga oshiriladi.`;
      } else {
        timeGroup.style.display = 'none';
        timeNote.style.display = 'none';
      }
    });
  });

  document.getElementById('submitBtn').addEventListener('click', () => {
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const timeInput = document.getElementById('timeInput').value.trim();
    errorMsg.style.display = 'none';

    if (!selectedService) {
      errorMsg.textContent = '⚠️ Iltimos, shifokor yoki xizmatni tanlang.';
      errorMsg.style.display = 'block';
      return;
    }
    if (!fullName) {
      errorMsg.textContent = '⚠️ Iltimos, ism-familiyangizni kiriting.';
      errorMsg.style.display = 'block';
      return;
    }
    if (!phone) {
      errorMsg.textContent = '⚠️ Iltimos, telefon raqamingizni kiriting.';
      errorMsg.style.display = 'block';
      return;
    }
    if (paidServices.includes(selectedService) && !timeInput) {
      errorMsg.textContent = '⚠️ Iltimos, kelish vaqtini kiriting.';
      errorMsg.style.display = 'block';
      return;
    }

    const data = {
      full_name: fullName,
      phone: phone,
      service: selectedService,
      appointment_time: paidServices.includes(selectedService) ? timeInput : null
    };

    tg.sendData(JSON.stringify(data));
    tg.close();
  });
</script>

</body>
</html>
